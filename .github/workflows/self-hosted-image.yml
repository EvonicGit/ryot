name: Self-hosted image

# Manual only: the deployed image is built on blackbox (~/ryot-build, tag
# ryot:local). Run this for backend changes or a full registry image.
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOON_TOOLCHAIN_FORCE_GLOBALS: true
      APP_VERSION: v10.3.0-self-hosted-unlocked
      UNKEY_ROOT_KEY: unused-in-self-hosted-build
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@937d7dbbc1ec218aa8641c792d5821addebd9f03
        with:
          auto-install: true
          moon-version: "1.41.8"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build notification templates
        run: moon run transactional:build

      # Build in the same Debian release as the runtime image (node:*-bookworm-slim)
      # so the binary never needs a newer glibc than the runtime has. The floating
      # cross-rs ":main" image moved to Ubuntu 24.04 (glibc 2.39) and broke startup.
      - name: Build backend
        run: |
          rm -rf target
          docker run --rm -v "$PWD":/src -w /src \
            -e APP_VERSION -e UNKEY_ROOT_KEY \
            rust:1.93.1-bookworm bash -c '
              set -euxo pipefail
              apt-get update
              apt-get --assume-yes --no-install-recommends install patch libssl-dev clang
              cargo build --locked --target x86_64-unknown-linux-gnu --release'

      - name: Check backend glibc requirement
        run: |
          required=$(objdump -T target/x86_64-unknown-linux-gnu/release/backend | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "Backend requires glibc $required; runtime (bookworm) has 2.36"
          [ "$(printf '%s\n2.36\n' "$required" | sort -V | tail -1)" = "2.36" ]

      - name: Prepare Docker artifact
        run: |
          mkdir -p artifact/backend-amd64
          cp target/x86_64-unknown-linux-gnu/release/backend artifact/backend-amd64/backend

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/evonicgit/ryot:self-hosted-unlocked
          cache-from: type=gha
          cache-to: type=gha,mode=max

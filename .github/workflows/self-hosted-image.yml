name: Self-hosted image

on:
  push:
    branches: ["self-hosted-templates"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MOON_TOOLCHAIN_FORCE_GLOBALS: true
      APP_VERSION: v10.3.0-self-hosted-templates
      UNKEY_ROOT_KEY: unused-in-self-hosted-build
    steps:
      - uses: actions/checkout@v4

      - uses: moonrepo/setup-toolchain@937d7dbbc1ec218aa8641c792d5821addebd9f03
        with:
          auto-install: true
          moon-version: "1.41.8"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "yarn"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"

      - uses: Swatinem/rust-cache@v2

      - name: Build notification templates
        run: moon run transactional:build

      - name: Build backend
        run: cargo build --locked --release --bin backend

      - name: Prepare Docker artifact
        run: |
          mkdir -p artifact/backend-amd64
          cp target/release/backend artifact/backend-amd64/backend

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ghcr.io/evonicgit/ryot:self-hosted-templates
          cache-from: type=gha
          cache-to: type=gha,mode=max
